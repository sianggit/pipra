<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipra — Pipeline & Release Engineering Platform</title>
  <meta name="description" content="Self-hosted deployment orchestration platform with zero-downtime cutover, real-time observability, verified health checks, and dependable rollback." />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />

  <!-- Early Theme Pre-Hydration (0ms FOUC Prevention) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('pipra-theme');
        var theme = saved || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          window.addEventListener('DOMContentLoaded', function() {
            var el = document.getElementById('pipra-init-logo');
            if (el) el.src = '/assets/logo-navy-tagline.png';
          });
        }
      } catch (e) {}
    })();
  </script>

  <!-- Modern Typography: Plus Jakarta Sans, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Pipra Design System Stylesheets -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/loading-screen.css" />

  <!-- Vendor Libraries (Self-hosted Three.js for 3D bird animation) -->
  <script src="/vendor/three.min.js"></script>
</head>
