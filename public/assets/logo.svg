<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 68" width="300" height="68" fill="none">
  <defs>
    <!-- Top Wing Gradient: Electric Cyan (#38bdf8) -> Royal Blue (#2563eb) -> Deep Blue (#1d4ed8) -->
    <linearGradient id="pipra-top-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Top Wing Highlight / Sheen -->
    <linearGradient id="pipra-wing-sheen" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Wing Gradient: Indigo (#4f46e5) -> Electric Violet (#7c3aed) -> Purple (#a855f7) -->
    <linearGradient id="pipra-bottom-wing" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wing Under-Fold Shadow -->
    <linearGradient id="pipra-fold-shadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>

    <!-- Head / Chest Gradient: Brilliant Platinum to Silver-Blue -->
    <linearGradient id="pipra-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="pipra-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3b82f6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Pipra Bird Symbol (Rendered with precise anatomical curves) -->
  <g class="pipra-symbol" filter="url(#pipra-ambient-glow)" transform="translate(6, 4)">
    <!-- 1. Bottom Wing (Vivid Violet-Indigo gradient flight feather) -->
    <path d="M 33 34 C 28 42, 23 51, 16 57 C 18 58, 22 57, 28 50 C 33 44, 38 38, 43 32 Z" 
          fill="url(#pipra-bottom-wing)" />
    <!-- Bottom Wing Highlight -->
    <path d="M 20 54 C 24 51, 28 46, 33 40 C 31 43, 27 49, 21 53 Z" 
          fill="#ffffff" opacity="0.3" />

    <!-- 2. Fold Shadow between wings -->
    <path d="M 26 31 C 32 35, 38 35, 43 32 C 37 37, 30 38, 23 34 Z" 
          fill="url(#pipra-fold-shadow)" />

    <!-- 3. Top Wing (Soaring Cyan to Royal Blue primary wing) -->
    <path d="M 3 13 C 12 14, 25 21, 35 29 C 41 33, 44 33, 44 32 C 37 28, 29 23, 20 18 C 14 15, 8 13, 3 13 Z" 
          fill="url(#pipra-top-wing)" />

    <!-- Top Wing Core & Sheen -->
    <path d="M 3 13 C 13 14, 24 20, 34 28 C 25 23, 16 18, 4 14 Z" 
          fill="url(#pipra-wing-sheen)" />

    <!-- 4. Head, Beak & Chest (Sleek aerodynamic silver-white forward silhouette) -->
    <path d="M 35 29 C 39 23, 44 19, 50 18 C 55 17, 57 20, 60 21 C 61 21, 59 22, 57 23 C 53 26, 48 31, 43 34 C 39 36, 33 34, 35 29 Z" 
          fill="url(#pipra-head-grad)" />

    <!-- 5. Beak Tip Accent -->
    <path d="M 57 21 L 60 21 L 57 23 Z" fill="#3b82f6" />

    <!-- 6. Eye -->
    <circle cx="51.5" cy="20.5" r="1.4" fill="#080c14" />
  </g>

  <!-- Wordmark "Pipra" in bold Inter -->
  <text x="76" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.035em" fill="#f8fafc">Pipra</text>

  <!-- Product Descriptor -->
  <text x="77" y="52" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.03em" fill="#94a3b8">Pipeline &amp; Release Engineering Platform</text>
</svg>
